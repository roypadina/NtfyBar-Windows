name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test NtfyBar.sln -c Release

      - name: Publish
        run: >
          dotnet publish src/NtfyBar.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip
        shell: pwsh
        run: |
          $name = "NtfyBar-win-x64-$($env:GITHUB_SHA.Substring(0, 7))"
          Compress-Archive -Path publish/NtfyBar.exe, README.md, LICENSE -DestinationPath "$name.zip"
          "ZIP_NAME=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
